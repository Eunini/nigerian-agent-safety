[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nigerian-agent-safety"
version = "0.1.0"
description = "Reproducible African-language AI experiments with explicit evidence status"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "huggingface-hub>=0.34,<1", "matplotlib>=3.9,<4", "reportlab>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["safety*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
